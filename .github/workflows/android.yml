name: Android
on:
  push:
    paths: ['android/**', 'port/ntr/**', '.github/workflows/android.yml', 'docker_build.bat']
  pull_request:
    paths: ['android/**', 'port/ntr/**', '.github/workflows/android.yml', 'docker_build.bat']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Native filesystem and importer regression tests (no ROM)
        run: bash android/tests/run-host-tests.sh
      - name: Build and lint ARM64 APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sm64ds-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
