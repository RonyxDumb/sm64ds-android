name: Android
on:
  push:
    paths: ['android/**', 'src/**', 'include/**', 'port/ntr/**', 'port/tools/hostgen.py',
            'config/arm9/symbols.txt', 'config/arm9/itcm/symbols.txt',
            'config/arm9/overlays/ov007/symbols.txt', 'external/sm64ds-pc',
            '.gitmodules', '.github/workflows/android.yml', 'docker_build.bat']
  pull_request:
    paths: ['android/**', 'src/**', 'include/**', 'port/ntr/**', 'port/tools/hostgen.py',
            'config/arm9/symbols.txt', 'config/arm9/itcm/symbols.txt',
            'config/arm9/overlays/ov007/symbols.txt', 'external/sm64ds-pc',
            '.gitmodules', '.github/workflows/android.yml', 'docker_build.bat']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Install headless GLES test dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
      - name: Native filesystem and importer regression tests (no ROM)
        run: bash android/tests/run-host-tests.sh
      - name: Native game dependency bounds (no ROM)
        run: bash android/tests/run-game-tests.sh
      - name: Execute recovered frontend core (no ROM)
        run: bash android/tests/run-frontend-tests.sh
      - name: Test GLES3 renderer without ROM assets
        run: |
          python3 android/tools/native_sources.py --out /tmp/native-src
          g++ -std=c++17 -Wall -Wextra -Werror -DSM64DS_PLATFORM_PC -Iinclude -Iport/ntr/include -Iandroid/app/src/main/cpp android/tests/gles_test.cpp android/app/src/main/cpp/{scene,gles_renderer,screen_renderer}.cpp android/app/src/main/cpp/runtime/{resources,game_heap}.cpp /tmp/native-src/src/SharedFilePtr.cpp port/ntr/{bmd,fs,gx,io,lz77,texture}.cpp -lEGL -lGLESv2 -o /tmp/gles_test
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/gles_test
      - name: Build and lint ARM64 APK
        working-directory: android
        shell: bash
        run: |
          # Maven Central may rate-limit GitHub runners with HTTP 429.
          # Retry ONLY transient repository failures; compiler/linker errors
          # must fail without being masked by repeated builds.
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug assembleRelease lintDebug 2>&1 | tee /tmp/sm64ds-gradle-build.log; then
              exit 0
            fi
            if ! grep -Eqi 'Too Many Requests|status code 429|HTTP 429|Read timed out' /tmp/sm64ds-gradle-build.log; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sm64ds-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  frontend-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Execute recovered frontend on native ARM64 (no ROM)
        run: bash android/tests/run-frontend-tests.sh
