name: Android
on:
  push:
    paths: ['android/**', 'port/ntr/**', '.github/workflows/android.yml', 'docker_build.bat']
  pull_request:
    paths: ['android/**', 'port/ntr/**', '.github/workflows/android.yml', 'docker_build.bat']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Install headless GLES test dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
      - name: Native filesystem and importer regression tests (no ROM)
        run: bash android/tests/run-host-tests.sh
      - name: Test GLES3 renderer without ROM assets
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iport/ntr/include -Iandroid/app/src/main/cpp android/tests/gles_test.cpp android/app/src/main/cpp/{scene,gles_renderer}.cpp port/ntr/{bmd,fs,gx,lz77,texture}.cpp -lEGL -lGLESv2 -o /tmp/gles_test
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/gles_test
      - name: Build and lint ARM64 APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sm64ds-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
